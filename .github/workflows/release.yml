name: Release

# Not active until you push a tag like v0.2.0 (see docs/RELEASING.md). Two jobs:
#
#   build    read-only token. Installs, runs the checks, packs ptch-<version>.tgz and SHA256SUMS
#            (and checks that the tag matches the version in apps/cli/package.json), and keeps them
#            as a workflow artifact. This is the only job that runs project code.
#   publish  the only job with a write token. It downloads that artifact, verifies the checksum
#            and creates the GitHub Release. It checks out nothing and installs nothing.
#
# No secrets beyond the GITHUB_TOKEN that Actions provides. Nothing is published to npm.
#
# Run it by hand (Actions -> Release -> Run workflow) to build the files and keep them as a
# workflow artifact without creating a release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build the CLI
    if: github.repository == 'xcrrr/ptch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Pack the CLI
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/release-pack.mjs --expect-version "${GITHUB_REF_NAME}"
          else
            node scripts/release-pack.mjs
          fi
          cat release/SHA256SUMS

      - name: Keep the files as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ptch-release
          path: |
            release/ptch-*.tgz
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Create the GitHub Release
    if: github.repository == 'xcrrr/ptch' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files; nothing else
    steps:
      - name: Download the built files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ptch-release
          path: release

      - name: Verify the checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          # Versions before 1.0 and tags with a suffix (v0.2.0-rc.1) are marked as pre-releases.
          case "${GITHUB_REF_NAME}" in
            v0.* | *-*) flags="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            release/ptch-*.tgz release/SHA256SUMS \
            --title "ptch ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            ${flags}
